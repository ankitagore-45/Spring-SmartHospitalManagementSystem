<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Doctor Login</title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{
            background:#f4f7fc;
        }

        .login-card{
            border:none;
            border-radius:15px;
            box-shadow:0 4px 10px rgba(0,0,0,0.1);
        }

    </style>

</head>

<body>

<div class="container d-flex justify-content-center align-items-center"
     style="height:100vh;">

    <div class="card login-card p-4"
         style="width:400px;">

        <div class="text-center mb-4">

            <i class="bi bi-person-badge-fill text-success"
               style="font-size:50px;"></i>

            <h3 class="mt-2">
                Doctor Login
            </h3>

        </div>

        <form id="doctorLoginForm">

            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <input
                type="email"
                id="email"
                class="form-control"
                required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input
                type="password"
                id="password"
                class="form-control"
                required>

            </div>

            <button
            type="submit"
            class="btn btn-success w-100">

                Login

            </button>

        </form>
		<div class="text-center mt-3">
		
		                <a href="/index.html"
		                    class="btn btn-outline-secondary btn-sm">
		
		                    Back To Home
		
		                </a>
		
		            </div>
    </div>

</div>

<script>

document.getElementById("doctorLoginForm")

.addEventListener("submit", function(e){

    e.preventDefault();

    let loginData = {

        email:
            document.getElementById("email").value,

        password:
            document.getElementById("password").value
    };

    fetch("https://spring-smarthospitalmanagementsystem-6.onrender.com/doctor/login", {

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify(loginData)

    })

    .then(response => response.text())

    .then(data => {

        if(data === "SUCCESS"){

           // alert("Doctor Login Successful");

		   window.location.href = "https://spring-smarthospitalmanagementsystem-6.onrender.com/doctor/doctor-dashboard";
        }

        else{

            alert("Invalid Email or Password");

        }

    });

});

</script>

</body>
</html>

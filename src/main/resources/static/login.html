	<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Smart Hospital</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body class="bg-light">

<div class="container">

    <div class="row justify-content-center align-items-center vh-100">

        <div class="col-md-6 col-lg-5">

            <div class="card shadow border-0">

                <div class="card-body p-5">

                    <!-- Heading -->
                    <div class="text-center mb-4">

                        <i class="bi bi-person-circle text-success" style="font-size: 60px;"></i>

                        <h2 class="fw-bold mt-3">Login</h2>

                        <p class="text-muted">Welcome back to Smart Hospital</p>

                    </div>

                    <!-- Error message box -->
                    <div id="errorMsg" class="text-danger mb-3 text-center fw-semibold"></div>

                    <!-- FORM -->
                    <form name="loginForm"
                          action="/user/login"
                          method="post"
                          onsubmit="return validateForm()">

                        <!-- Email -->
                        <div class="mb-3">

                            <label class="form-label">Email Address</label>

                            <input name="email"
                                   type="email"
                                   class="form-control"
                                   placeholder="Enter your email"
                                   required>

                        </div>

                        <!-- Password -->
                        <div class="mb-3">

                            <label class="form-label">Password</label>

                            <input type="password"
                                   name="password"
                                   class="form-control"
                                   placeholder="Enter your password"
                                   required>

                        </div>

                        <!-- Remember Me -->
                        <div class="form-check mb-3">

                            <input class="form-check-input" type="checkbox">

                            <label class="form-check-label">Remember Me</label>

                        </div>

                        <!-- Button -->
                        <button type="submit" class="btn btn-success w-100">
                            Login
                        </button>

                    </form>

                    <!-- Links -->
                    <div class="text-center mt-4">

                        <a href="forgot-password.html" class="text-decoration-none">Forgot Password?</a>

                        <p class="mt-3 mb-0">

                            Don't have an account?

                            <a href="register.html" class="text-success text-decoration-none fw-semibold">
                                Register
                            </a>

                        </p>

                    </div>
					<div class="text-center mt-3">
					
					                <a href="/index.html"
					                    class="btn btn-outline-secondary btn-sm">
					
					                    Back To Home
					
					                </a>
					
					            </div>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- ================= VALIDATION SCRIPT ================= -->

<script>
function validateForm() {

    let email = document.forms["loginForm"]["email"].value;
    let password = document.forms["loginForm"]["password"].value;

    let errorMsg = document.getElementById("errorMsg");

    errorMsg.innerHTML = "";

    // 1. Empty check
    if (email === "" || password === "") {
        errorMsg.innerHTML = "⚠ All fields are required";
        return false;
    }

    // 2. Password length check
    if (password.length < 6) {
        errorMsg.innerHTML = "⚠ Password must be at least 6 characters";
        return false;
    }

    return true;
}
</script>

<!-- ================= BACKEND ERROR HANDLING ================= -->

<script>
window.onload = function () {

    const params = new URLSearchParams(window.location.search);

    if (params.get("error") === "true") {

        document.getElementById("errorMsg").innerHTML =
            "❌ Invalid email or password";
    }
};
</script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Smart Hospital</title>

    <!-- Bootstrap CSS -->

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="bg-light">

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-6 col-md-8">

                <div class="card shadow-lg border-0 rounded-4">

                    <div class="card-body p-5">

                        <!-- Heading -->

                        <div class="text-center mb-4">

                            <i class="bi bi-person-plus-fill text-success"
                            style="font-size: 60px;"></i>

                            <h2 class="fw-bold mt-3">
                                Create Account
                            </h2>

                            <p class="text-muted">
                                Welcome to Smart Hospital
                            </p>

                        </div>

                        <!-- Form Start -->

                        <form action="https://spring-smarthospitalmanagementsystem-6.onrender.com/user/register" method="post">

                            <!-- Full Name -->

                            <div class="mb-3">

                                <label class="form-label" >
                                    Full Name
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="bi bi-person-fill"></i>
                                    </span>

                                    <input
                                    type="text"
                                    class="form-control"
                                    name="fullName"
                                    placeholder="Enter full name"
                                    required>

                                </div>

                            </div>



                            <!-- Email -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Email Address
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="bi bi-envelope-fill"></i>
                                    </span>

                                    <input
                                    type="email"
                                    name="email"
                                    class="form-control"
                                    placeholder="Enter your email"
                                    required>

                                </div>

                            </div>



                            <!-- Mobile -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Mobile Number
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="bi bi-telephone-fill"></i>
                                    </span>

                                    <input
                                    type="tel"
                                    name="phone"
                                    class="form-control"
                                    placeholder="Enter mobile number"
                                    required>

                                </div>

                            </div>



                            <!-- Password -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Password
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="bi bi-lock-fill"></i>
                                    </span>
                                  
									<input
									type="password"
									name="password"
									class="form-control"
									placeholder="Enter password"
									minlength="6"
									required>

                                </div>

                            </div>



                            <!-- Confirm Password -->

                            <div class="mb-4">

                                <label class="form-label">
                                    Confirm Password
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="bi bi-shield-lock-fill"></i>
                                    </span>

									<input
									type="password"
									class="form-control"
									placeholder="Confirm password"
									name="confirmPassword"
									minlength="6"
									required>

                                </div>

                            </div>



                            <!-- Gender -->

                            <div class="mb-4">

                                <label class="form-label d-block mb-3">
                                    Gender
                                </label>

                                <div class="d-flex gap-3 flex-wrap">

                                    <input
                                    type="radio"
                                    class="btn-check"
                                    name="gender"
                                    id="male"
                                    value="Male"
                                    autocomplete="off"
                                    required>

                                    <label class="btn btn-outline-success px-4"
                                    for="male">

                                    <i class="bi bi-gender-male"></i>
                                    Male

                                    </label>



                                    <input
                                        type="radio"
                                        class="btn-check"
                                        name="gender"
                                        id="female"
                                        value="Female"
                                        autocomplete="off">

                                    <label class="btn btn-outline-success px-4"
                                    for="female">

                                        <i class="bi bi-gender-female"></i>
                                        Female

                                    </label>

                                    


                                  <input
                                     type="radio"
                                     class="btn-check"
                                     name="gender"
                                     id="other"
                                     value="Other"
                                     autocomplete="off">

                                    <label class="btn btn-outline-success px-4"
                                    for="other">

                                        <i class="bi bi-person"></i>
                                        Other

                                    </label>

                                </div>

                            </div>



                            <!-- Terms -->

                            <div class="form-check mb-4">

                                <input
                                class="form-check-input"
                                type="checkbox"
                                required>

                                <label class="form-check-label">
                                    Agree to Terms and Conditions
                                </label>

                            </div>



                            <!-- Register Button -->

                            <button
                            type="submit"
                            class="btn btn-success w-100 py-2 fw-bold rounded-3">

                                Register

                            </button>

                        </form>

                        <!-- Extra Links -->

                        <div class="text-center mt-4">

                            <p class="mb-0">

                                Already have an account?

                                <a href="login.html" class="text-success text-decoration-none fw-semibold">

                                    Login

                                </a>

                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>
	<script>
	
	document.querySelector("form").addEventListener("submit", function(e){
	
	    let password =
	        document.getElementsByName("password")[0].value;
	
	    let confirmPassword =
	        document.getElementsByName("confirmPassword")[0].value;
	
	    if(password.length < 6){
	
	        alert("Password must be at least 6 characters");
	
	        e.preventDefault();
	        return;
	    }
	
	    if(password !== confirmPassword){
	
	        alert("Password and Confirm Password do not match");
	
	        e.preventDefault();
	        return;
	    }
	
	});
	
	</script>
</body>

</html>

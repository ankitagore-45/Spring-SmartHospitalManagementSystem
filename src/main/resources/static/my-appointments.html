<!-- Appointment Table Section -->

<section class="container py-5">

    <div class="card shadow border-0">

        <div class="card-body">

            <h3 class="text-success fw-bold mb-4">

                Appointment History

            </h3>

            <div class="table-responsive">

                <table class="table table-bordered table-hover align-middle">

                    <thead class="table-success">

                        <tr>

                            <th>ID</th>
                            <th>Doctor</th>
                            <th>Department</th>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Status</th>

                        </tr>

                    </thead>

                    <tbody id="appointmentTableBody">

                        <!-- Data will come from JavaScript -->

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</section>

<footer class="bg-dark text-white text-center py-3">

    </p>

<!-- Bootstrap JS -->

<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>



<!-- Fetch Appointment Data -->

<script>

fetch(	"http://localhost:8181/appointment/myappointments")

.then(response => response.json())

.then(data => {

    let table = document.getElementById("appointmentTableBody");

	data.forEach(app => {
	
	    let color = "warning";
	
	    if(app.status === "APPROVED") color = "success";
	    else if(app.status === "REJECTED") color = "danger";
	    else if(app.status === "BOOKED") color = "primary";
	
	    table.innerHTML += `
	        <tr>
	            <td>${app.id}</td>
	            <td>${app.doctorName}</td>
	            <td>${app.department}</td>
	            <td>${app.appointmentDate}</td>
	            <td>${app.appointmentTime}</td>
	            <td>
	                <span class="badge bg-${color}">
	                    ${app.status}
	                </span>
	            </td>
	        </tr>
	    `;
	});
})

.catch(error => {

    console.log("Error:", error);

});

</script>

</body>

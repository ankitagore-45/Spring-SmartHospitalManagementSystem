<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Medical Store Login</title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{

            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
         

        }

        .login-card{

            width:100%;
            max-width:420px;
            border:none;
            border-radius:20px;
            padding:40px;
            background:white;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);

        }

        .login-icon{

            font-size:70px;
            color:#198754;

        }

        .form-control{

            border-radius:12px;
            height:50px;

        }

        .btn-login{

            border-radius:12px;
            height:50px;
            font-weight:bold;

        }

    </style>

</head>

<body>

    <div class="card login-card">

        <div class="text-center">

            <i class="bi bi-capsule-pill login-icon"></i>

            <h2 class="fw-bold mt-3">
                Medical Store
            </h2>

            <p class="text-muted">
                Login to manage prescriptions
            </p>

        </div>

        <form action="/user/login"
              method="post">

            <input type="email"
                   name="email"
                   class="form-control mb-3"
                   placeholder="Enter Email"
                   required>

            <input type="password"
                   name="password"
                   class="form-control mb-4"
                   placeholder="Enter Password"
                   required>

            <button class="btn btn-success w-100 btn-login">

                <i class="bi bi-box-arrow-in-right"></i>
                Login

            </button>
			

        </form>
		<div class="text-center mt-3">
		
		                <a href="/index.html"
		                    class="btn btn-outline-secondary btn-sm">
		
		                    Back To Home
		
		                </a>
		
		            </div>
    </div>

</body>
</html>

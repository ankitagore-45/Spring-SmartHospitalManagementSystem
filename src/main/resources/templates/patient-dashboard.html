<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Patient Dashboard</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

	<style>
		body {
			background-color: #f4f7fc;
		}

		.navbar {
			background-color: #0d6efd;
		}

		.navbar-brand,
		.nav-link,
		.welcome-text {
			color: white !important;
		}

		.card {
			border: none;
			border-radius: 15px;
			box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
		}

		.dashboard-card {
			transition: 0.3s;
		}

		.dashboard-card:hover {
			transform: translateY(-5px);
		}

		.section-title {
			font-weight: bold;
			color: #0d6efd;
		}
	</style>
</head>

<body>

	<!-- Navbar -->
	<nav class="navbar navbar-expand-lg navbar-dark px-4">
		<div class="container-fluid">

			<a class="navbar-brand fw-bold" href="#">
				Smart Hospital
			</a>

			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
				<span class="navbar-toggler-icon"></span>
			</button>

			<div class="collapse navbar-collapse" id="navbarNav">

				<ul class="navbar-nav me-auto">
					<li class="nav-item">
						<a class="nav-link active" href="/user/patient/dashboard">
							Home
						</a>
					</li>

					<li class="nav-item">
						<a class="nav-link" href="/appointment-page">Book Appointment</a>
					</li>

					<li class="nav-item">
						<a class="nav-link" href="/my-appointments.html">My Appointments</a>
					</li>

					<li class="nav-item">
						<a class="nav-link" href="#">Medical Records</a>
					</li>
					<li class="nav-item">
					    <a class="nav-link" href="/user/my-prescription">
					        Prescriptions
					    </a>
					</li>
				</ul>

				<!-- to show dr name in corner -->
				<div class="d-flex align-items-center gap-3">

					<span id="PatientWelcome" class="text-white fw-bold">
						Welcome
					</span>

					<a 	href="/user/logout" class="btn btn-light btn-sm">
						Logout
					</a>

				</div>
			</div>
		</div>
	</nav>


	<!-- Dashboard Content -->
	<div class="container mt-5">

		<h2 class="mb-4 section-title">
			Patient Dashboard
		</h2>

		<div class="row g-4">

			<div class="col-md-4">
				<div class="card dashboard-card p-4 text-center">
					<h4>Total Appointments</h4>
					<h1 class="text-primary" id="totalAppointments">0</h1>
				</div>
			</div>

			<div class="col-md-4">
				<div class="card dashboard-card p-4 text-center">
					<h4>Upcoming Visits</h4>
					<h1 class="text-success" id="upcomingVisits">0</h1>
				</div>
			</div>

			<div class="col-md-4">
				<div class="card dashboard-card p-4 text-center">
					<h4>Prescriptions</h4>
					<h1 class="text-danger"	id="prescriptions">0</h1>
				</div>
			</div>
		</div>


		<!-- Appointment Table -->
		<div class="card mt-5 p-4">

			<h4 class="mb-4 section-title">
				Recent Appointments
			</h4>

			<div class="table-responsive">
				<table class="table table-bordered table-hover">

					<thead class="table-primary">
						<tr>
							<th>Doctor</th>
							<th>Date</th>
							<th>Department</th>
							<th>Status</th>
						</tr>
					</thead>

					<tbody id="recentAppointments"></tbody>
				</table>
			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

	<script>
		fetch("https://spring-smarthospitalmanagementsystem-6.onrender.com/appointment/myappointments")
			.then(res => res.json())   // ✅ REQUIRED
			.then(data => {

				console.log("Recent API data:", data);

				let table = document.getElementById("recentAppointments");

				table.innerHTML = "";

				data.slice(0, 3).forEach(app => {

					let statusColor = "warning";

					if (app.status === "APPROVED") {
						statusColor = "success";
					}

					else if (app.status === "REJECTED") {
						statusColor = "danger";
					}

					else if (app.status === "BOOKED") {
						statusColor = "primary";
					}

					table.innerHTML += `
	            <tr>
	                <td>${app.doctorName}</td>
	                <td>${app.appointmentDate}</td>
	                <td>${app.department}</td>
	                <td>
	                    <span class="badge bg-${statusColor}">
	                        ${app.status}
	                    </span>
	                </td>
	            </tr>
	        `;
				});
			})
			.catch(err => console.log("Error:", err));


			fetch("https://spring-smarthospitalmanagementsystem-6.onrender.com/appointment/myappointments")
			.then(res => res.json())
			.then(data => {

				console.log("Dashboard data:", data);

				// Total appointments
				document.getElementById("totalAppointments").innerText = data.length;

				// Upcoming visits (Booked + Approved future dates logic simple)
				let today = new Date();
				
				let upcoming = data.filter(app => {
				
				    return app.status === "APPROVED" &&
				           new Date(app.appointmentDate) >= today;
				
				}).length;
				
				document.getElementById("upcomingVisits")
				.innerText = upcoming;
				
				//prescritpion logic to show excat count 
				fetch("https://spring-smarthospitalmanagementsystem-6.onrender.com/prescription/myPrescription")
				.then(res => res.json())
				.then(data => {
				
				    document.getElementById("prescriptions").innerText =
				        data.length;
				
				})
				.catch(err => console.log(err));
			})
			.catch(err => console.log("Error:", err));

		//toshow patient name in corner


		fetch("https://spring-smarthospitalmanagementsystem-6.onrender.com/user/logged-Patient")

			.then(response => response.text())

			.then(data => {

				document.getElementById("PatientWelcome")
					.innerText = "Welcome P. " + data;

			});

		// update appointment status

		function updateStatus(id, status) {

			fetch(`https://spring-smarthospitalmanagementsystem-6.onrender.com/doctor/appointment/status/${id}?status=${status}`, {

				method: "PUT"

			})

				.then(response => response.text())

				.then(data => {

					alert(data);

					location.reload();

				})

				.catch(error => console.log(error));

		}


	</script>
</body>

</html>

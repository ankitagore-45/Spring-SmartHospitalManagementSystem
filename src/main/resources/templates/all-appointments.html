<!DOCTYPE html>
<html>
<head>

    <title>All Appointments</title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-4 text-primary">
        All Appoitments
    </h2>
	 
	<span><a href="/user/admin/dashboard" class="btn btn-success btn-sm"> Home</a>	</span>

</div>
<div class="table-responsive">

           <table class="table table-bordered table-hover align-middle">

               <thead class="table-success">

                   <tr>

                       <th>Patient</th>
                       <th>Doctor</th>
                       <th>Department</th>
                       <th>Date</th>
					   <th>Symptoms</th>
                       <th>Status</th>
					    <th>Action</th>

                   </tr>

               </thead>

               <tbody id="appointmentTable">

               </tbody>

           </table>

       </div>

</div>

<script>
	

	//for deleteing apointment
	function deleteAppointment(id) {
	
	    if(confirm("Are you sure to delete appointment?")) {
	
	        fetch(`https://spring-smarthospitalmanagementsystem-6.onrender.com/appointment/delete/${id}`, {
	
	            method: "DELETE"
	
	        })
	
	        .then(response => response.text())
	
	        .then(data => {
	
	         //   alert(data);
	
	            location.reload();
	
	        })
	
	        .catch(error => console.log(error));
	
	    }
	
	}
	//
		fetch("	https://spring-smarthospitalmanagementsystem-6.onrender.com/appointment/all")
	
	.then(response => response.json())
	
	.then(data => {
	
	    let table = document.getElementById("appointmentTable");
	
	    data.forEach(app => {
			let badgeColor = "warning";
			
			if(app.status === "APPROVED"){
			    badgeColor = "success";
			}
			else if(app.status === "REJECTED"){
			    badgeColor = "danger";
			}
			else if(app.status === "BOOKED"){
			    badgeColor = "primary";
			}
	
	        table.innerHTML += `
	
	            <tr>
	
	                <td>${app.fullName}</td>
	
	                <td>${app.doctorName}</td>
	
	                <td>${app.department}</td>
	
	                <td>${app.appointmentDate}</td>
	
	                <td>${app.symptoms}</td>
	
	                <td>
	
	                    <span class="badge bg-${badgeColor}">
	                        ${app.status}
	                    </span>
	
	                </td>
					<td>
					
					    <button
					    onclick="deleteAppointment(${app.id})"
					    class="btn btn-danger btn-sm">
					
					        Delete
					
					    </button>
					
					</td>
		
	            </tr>
	
	        `;
	
	    });
	
	});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Medical Store Dashboard</title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <style>

        body{
            background:#f4f7fc;
        }

        .navbar{
            background:#198754;
        }

        .navbar-brand,
        .nav-link{
            color:white !important;
        }

        .card{
            border:none;
            border-radius:15px;
            box-shadow:0 4px 10px rgba(0,0,0,0.1);
        }

    </style>

</head>

<body>

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark px-4">

    <div class="container-fluid">

        <a class="navbar-brand fw-bold">
            Medical Store Dashboard
        </a>

        <div class="d-flex">

            <a href="/user/logout"
               class="btn btn-light btn-sm">
                Logout
            </a>

        </div>
		

    </div>

</nav>


<div class="container mt-5">

    <h2 class="mb-4 text-success">
        All Prescriptions
    </h2>
	<!-- 🔍 SEARCH BAR -->
	<div class="mb-3 d-flex">
	
	    <input type="text"
	           id="searchInput"
	           class="form-control me-2"
	           placeholder="Search by patient name or token">
	
	    <button class="btn btn-success"
	            onclick="searchPrescription()">
	        Search
	    </button>
	
	</div>

    <div class="card p-4">

        <div class="table-responsive">

            <table class="table table-bordered table-hover">

                <thead class="table-success">

                    <tr>
						<th>Token</th>
                        <th>Patient</th>
                        <th>Doctor</th>
                        <th>Medicines</th>
                        <th>Notes</th>
                        <th>Status</th>
                        <th>Action</th>
					

                    </tr>

                </thead>

                <tbody id="prescriptionTable">

                </tbody>

            </table>

        </div>

    </div>

</div>


<script>

fetch("https://spring-smarthospitalmanagementsystem-6.onrender.com/prescription/all")

.then(res => res.json())

.then(data => {

    let table =
        document.getElementById("prescriptionTable");

    table.innerHTML = "";

    data.forEach(p => {

        let badgeColor = "warning";

        if(p.deliveryStatus === "DISPENSED"){
            badgeColor = "success";
        }

        table.innerHTML += `

            <tr>
				<td>${p.token}</td>
				
                <td>${p.patientName}</td>

                <td>${p.doctorName}</td>

                <td>${p.medicines}</td>

                <td>${p.notes}</td>

                <td>

                    <span class="badge bg-${badgeColor}">
                        ${p.deliveryStatus}
                    </span>

                </td>

                <td>

                    <button
                    onclick="giveMedicine(${p.id})"
                    class="btn btn-success btn-sm">

                        Give Medicine

                    </button>

                </td>

            </tr>

        `;
    });

});


function giveMedicine(id){

    fetch(`https://spring-smarthospitalmanagementsystem-6.onrender.com/prescription/dispense/${id}`, {

        method:"PUT"

    })

    .then(res => res.text())

    .then(data => {

        alert(data);

        location.reload();

    });

}

//for search patient 
function searchPrescription(){

    let keyword =
        document.getElementById("searchInput").value;

    fetch(`https://spring-smarthospitalmanagementsystem-6.onrender.com/prescription/search?keyword=${keyword}`)

    .then(res => res.json())

    .then(data => {

        let table =
            document.getElementById("prescriptionTable");

        table.innerHTML = "";

        data.forEach(p => {

            let badgeColor = "warning";

            if(p.deliveryStatus === "DISPENSED"){
                badgeColor = "success";
            }

            table.innerHTML += `

            <tr>
				<td>${p.token}</td>
                <td>${p.patientName}</td>
                <td>${p.doctorName}</td>
                <td>${p.medicines}</td>
                <td>${p.notes}</td>
                <td>
                    <span class="badge bg-${badgeColor}">
                        ${p.deliveryStatus}
                    </span>
                </td>
                <td>
                    <button onclick="giveMedicine(${p.id})"
                        class="btn btn-success btn-sm">
                        Give Medicine
                    </button>
                </td>
            </tr>

            `;
        });

    });
}

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>

    <title>All Doctors</title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">
<div class="d-flex justify-content-between aling-item-center mb-4	">
    <h2 class="mb-4 text-primary">
        All Doctors
    </h2>
	<span><a href="/user/admin/dashboard" class="btn btn-success mb-4">Home</a></span>
</div>
    <table class="table table-bordered">

		<thead class="table-primary">
		
		    <tr>
		        <th>ID</th>
		        <th>Doctor Name</th>
		        <th>Email</th>
		        <th>Experience</th>
		        <th>Phone</th>
		        <th>Specialization</th>
				<th>Action</th>
		    </tr>
		
		</thead>

        <tbody id="doctorTable"></tbody>

    </table>

</div>
<script>
	
	
	//for deleteing apointment
	function deleteDoctor(id) {
	
	   if(confirm("Are you sure to delete doctor?")) {
	
	       fetch(`http://localhost:8181/doctor/delete/${id}`, {
	
	           method: "DELETE"
	
	       })
	
	       .then(response => response.text())
	
	       .then(data => {
	
	        //   alert(data);
	
	           location.reload();
	
	       })
	
	       .catch(error => console.log(error));
	
	   }
	
	}
	//

fetch("http://localhost:8181/doctor/all")

.then(response => response.json())

.then(data => {

    let table =
        document.getElementById("doctorTable");

    data.forEach(doctor => {

        table.innerHTML += `
        
            <tr>

                <td>${doctor.id}</td>

                <td>${doctor.doctorName}</td>

                <td>${doctor.email}</td>
                
                <td>${doctor.experience}</td>

                <td>${doctor.phone}</td>

                <td>${doctor.specialization}</td>
				<td>
								
					<button
					onclick="deleteDoctor(${doctor.id})"
					class="btn btn-danger btn-sm">
					
					    Delete
					
					</button>
								
			    </td>

            </tr>

        `;

    });

});

</script>


</body>
</html>

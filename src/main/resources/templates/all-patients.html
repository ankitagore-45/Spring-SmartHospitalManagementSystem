<!DOCTYPE html>
<html>
<head>

    <title>All Patients</title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">
<div class="d-flex justify-content-between aling-item-center mb-4">
    <h2 class="mb-4 text-primary">
        All Patients
    </h2>
	 
	<span><a href="/user/admin/dashboard" class="btn btn-success btn-sm"> Home</a>	</span>

</div>
    <table class="table table-bordered">

        <thead class="table-primary">

            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
				<th>Action</th>
            </tr>

        </thead>

        <tbody id="patientTable"></tbody>

    </table>

</div>

<script>
	
	//for deleteing apointment
		function deletePatient(id) {
		
		   if(confirm("Are you sure to delete patient?")) {
		
		       fetch(`https://spring-smarthospitalmanagementsystem-6.onrender.com/user/delete/${id}`, {
		
		           method: "DELETE"
		
		       })
		
		       .then(response => response.text())
		
		       .then(data => {
		
		        //   alert(data);
		
		           location.reload();
		
		       })
		
		       .catch(error => console.log(error));
		
		   }
		
		}
		//

fetch("https://spring-smarthospitalmanagementsystem-6.onrender.com/user/all")

.then(response => response.json())

.then(data => {

    let table =
        document.getElementById("patientTable");

    data.forEach(user => {

        table.innerHTML += `

            <tr>

                <td>${user.id}</td>

                <td>${user.fullName}</td>

                <td>${user.email}</td>

                <td>${user.phone}</td>
				
				<td>
				
				<button
								onclick="deletePatient(${user.id})"
								class="btn btn-danger btn-sm">
								
								    Delete
			     </button>
				 
                 </td>
					
            </tr>

        `;

    });

});

</script>

</body>
</html>

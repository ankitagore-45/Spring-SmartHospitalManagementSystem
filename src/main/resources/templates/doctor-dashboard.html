	<!DOCTYPE html>
	<html lang="en">
	
	<head>
	
	    <meta charset="UTF-8">
	    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	
	    <title>Doctor Dashboard | Smart Hospital</title>
	
	    <!-- Bootstrap CSS -->
	
	    <link
	    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	    rel="stylesheet">
	
	    <!-- Bootstrap Icons -->
	
	    <link
	    rel="stylesheet"
	    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	
	    <style>
	
	        body{
	            background:#f4f7fc;
	        }
	
	        .navbar{
	            background:#198754;
	        }
	
	        .navbar-brand,
	        .nav-link,
	        .doctor-text{
	            color:white !important;
	        }
	
	        .card{
	            border:none;
	            border-radius:15px;
	            box-shadow:0 4px 10px rgba(0,0,0,0.1);
	        }
	
	        .dashboard-card{
	            transition:0.3s;
	        }
	
	        .dashboard-card:hover{
	            transform:translateY(-5px);
	        }
	
	        .section-title{
	            color:#198754;
	            font-weight:bold;
	        }
	
	    </style>
	
	</head>
	
	<body>
	
	<!-- Navbar Start -->
	
	<nav class="navbar navbar-expand-lg navbar-dark px-4">
	
	    <div class="container-fluid">
	
	        <a class="navbar-brand fw-bold" href="#">
	            <i class="bi bi-hospital"></i>
	            Smart Hospital
	        </a>
	
	        <button class="navbar-toggler"
	                type="button"
	                data-bs-toggle="collapse"
	                data-bs-target="#navbarNav">
	
	            <span class="navbar-toggler-icon"></span>
	
	        </button>
	
	        <div class="collapse navbar-collapse" id="navbarNav">
	
	            <ul class="navbar-nav me-auto">
	
	                <li class="nav-item">
						<a class="nav-link" href="/user/doctor/dashboard">
						    Home
						</a>
	                </li>
	
	                <li class="nav-item">
						<a class="nav-link" href="/doctor/appointments">
	                        Appointments
	                    </a>
	                </li>
	
	                <li class="nav-item">
						<a class="nav-link" href="/doctor/patients">	     
							        Patients
	                    </a>
	                </li>
	
	            </ul>
	                  <!-- to show dr name in corner -->
					  <div class="d-flex align-items-center gap-3">
					  
					      <span id="doctorWelcome"
					            class="text-white fw-bold">
					          Welcome Doctor
					      </span>
					  
					      <a href="/index.html"
					         class="btn btn-light btn-sm">
					          Logout
					      </a>
					  
					  </div>
	
	        </div>
	
	    </div>
	
	</nav>
	
	<!-- Navbar End -->
	
	
	<!-- Dashboard Content -->
	
	<div class="container mt-5">
	
	    <h2 class="section-title mb-4">
	        Doctor Dashboard
	    </h2>
	
	    <!-- Dashboard Cards -->
	
	    <div class="row g-4">
	
	        <!-- Total Appointments -->
	
	        <div class="col-md-4">
	
	            <div class="card dashboard-card p-4 text-center">
	
	                <i class="bi bi-calendar-check-fill text-primary"
	                   style="font-size:40px;"></i>
	
	                <h4 class="mt-3">
	                    Total Appointments
	                </h4>
	
	                <h1 class="text-primary" id="totalAppointments">
	                    0
	                </h1>
	
	            </div>
	
	        </div>
	
	        <!-- Approved -->
	
	        <div class="col-md-4">
	
	            <div class="card dashboard-card p-4 text-center">
	
	                <i class="bi bi-check-circle-fill text-success"
	                   style="font-size:40px;"></i>
	
	                <h4 class="mt-3">
	                    Approved
	                </h4>
	
					<h1 class="text-success" id="approvedAppointments">
	                    0
	                </h1>
	
	            </div>
	
	        </div>
	
	        <!-- Pending -->
	
	        <div class="col-md-4">
	
	            <div class="card dashboard-card p-4 text-center">
	
	                <i class="bi bi-hourglass-split text-warning"
	                   style="font-size:40px;"></i>
	
	                <h4 class="mt-3">
	                    Pending
	                </h4>
	
					<h1 class="text-warning" id="pendingAppointments">
	                    0
	                </h1>
	
	            </div>
	
	        </div>
	
	    </div>
	
	
	    <!-- Appointment Table -->
	
	    <div class="card mt-5 p-4">
	
	        <h4 class="section-title mb-4">
	            Patient Appointments
	        </h4>
	
	        <div class="table-responsive">
	
	            <table class="table table-bordered table-hover align-middle">
	
	                <thead class="table-success">
	
	                    <tr>
	
	                        <th>Patient</th>
	                        <th>Doctor</th>
	                        <th>Department</th>
	                        <th>Date</th>
	                        <th>Symptoms</th>
	                        <th>Status</th>
	                        <th>Action</th>
	
	                    </tr>
	
	                </thead>
	
	                <tbody id="appointmentTable">
	
	                </tbody>
	
	            </table>
	
	        </div>
	
	    </div>
	
	</div>
	
	
	<!-- Bootstrap JS -->
	
	<!-- model to send pricription-->
	<div class="modal fade"
	     id="prescriptionModal"
	     tabindex="-1">
	
	    <div class="modal-dialog">
	
	        <div class="modal-content">
	
	            <div class="modal-header">
	
	                <h5 class="modal-title">
	                    Add Prescription
	                </h5>
	
	                <button type="button"
	                        class="btn-close"
	                        data-bs-dismiss="modal">
	                </button>
	
	            </div>
	
	            <div class="modal-body">
	
	                <input type="hidden" id="patientName">
	
	                <input type="hidden" id="doctorName">
	
	                <div class="mb-3">
	
	                    <label class="form-label">
	                        Medicines
	                    </label>
	
	                    <textarea
	                    id="medicines"
	                    class="form-control"></textarea>
	
	                </div>
	
	                <div class="mb-3">
	
	                    <label class="form-label">
	                        Notes
	                    </label>
	
	                    <textarea
	                    id="notes"
	                    class="form-control"></textarea>
	
	                </div>
	
	            </div>
	
	            <div class="modal-footer">
	
	                <button
	                class="btn btn-success"
	                onclick="savePrescription()">
	                    Send Prescription
	                </button>
	
	            </div>
	
	        </div>
	
	    </div>
	
	</div>
	<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
	</script>
	
	
	<!-- Fetch Appointment Data -->
	
	<script>
	
		fetch("http://localhost:8181/doctor/my-appointments")
	
	.then(response => response.json())
	
	.then(data => {
	
	    let table = document.getElementById("appointmentTable");
	
	    data.forEach(app => {
	
	        let badgeColor = "primary";
	
	        if(app.status === "Approved"){
	            badgeColor = "success";
	        }
	
	        else if(app.status === "Rejected"){
	            badgeColor = "danger";
	        }
	
	        table.innerHTML += `
	
	            <tr>
	
	                <td>${app.fullName}</td>
	
	                <td>${app.doctorName}</td>
	
	                <td>${app.department}</td>
	
	                <td>${app.appointmentDate}</td>
	
	                <td>${app.symptoms}</td>
	
	                <td>
	
	                    <span class="badge bg-${badgeColor}">
	                        ${app.status}
	                    </span>
	
	                </td>
	
					<td>
					    <button onclick="updateStatus(${app.id}, 'APPROVED')"
					            class="btn btn-success btn-sm">
					        Approve
					    </button>
					
					    <button onclick="updateStatus(${app.id}, 'REJECTED')"
					            class="btn btn-danger btn-sm">
					        Reject
					    </button>
						
						<button
						onclick="openPrescriptionModal('${app.fullName}','${app.doctorName}')"
						    class="btn btn-warning btn-sm">
						        Prescription
						    </button>
					</td>
	            </tr>
	
	        `;
	
	    });
	
	});
	
	function addPrescription(id){
	
	    alert("Prescription for Appointment ID : " + id);
	
	}
	
	
	
	//toshow drname in corner
	
	
	fetch("http://localhost:8181/doctor/logged-doctor")
	
	.then(response => response.text())
	
	.then(data => {
	
	    document.getElementById("doctorWelcome")
	    .innerText = "Welcome Dr. " + data;
	
	});
	
	//for aprove delete sts
	
	function updateStatus(id, status) {
	
		fetch(`http://localhost:8181/doctor/appointment/status/${id}?status=${status}`, {
	        method: "PUT"
	    })
	    .then(res => res.text())
	    .then(msg => {
	        alert(msg);
	        location.reload(); // refresh table
	    })
	    .catch(err => console.log(err));
	}
	
	// doctor dashboard counts
	
	fetch("http://localhost:8181/doctor/my-appointments")
	
	.then(response => response.json())
	
	.then(data => {
	
	    // total count
	    document.getElementById("totalAppointments").innerText =
	        data.length;
	
	    // approved count
	    let approved = data.filter(app =>
	        app.status === "APPROVED").length;
	
	    document.getElementById("approvedAppointments").innerText =
	        approved;
	
	    // pending count
	    let pending = data.filter(app =>
	        app.status === "BOOKED").length;
	
	    document.getElementById("pendingAppointments").innerText =
	        pending;
	
	});
	
	
	//priscription model 
	function openPrescriptionModal(patient, doctor){
	
	    document.getElementById("patientName").value = patient;
	
	    document.getElementById("doctorName").value = doctor;
	
	    let modal =
	    new bootstrap.Modal(
	        document.getElementById("prescriptionModal")
	    );
	
	    modal.show();
	}
	//to sav precription 
	function savePrescription(){
	
	    let prescription = {
	
	        patientName:
	        document.getElementById("patientName").value,
	
	        doctorName:
	        document.getElementById("doctorName").value,
	
	        medicines:
	        document.getElementById("medicines").value,
	
	        notes:
	        document.getElementById("notes").value,
	
	        date:
	        new Date().toLocaleDateString()
	
	    };
	
	    fetch("http://localhost:8181/prescription/add", {
	
	        method: "POST",
	
	        headers: {
	            "Content-Type": "application/json"
	        },
	
	        body: JSON.stringify(prescription)
	
	    })
	
	    .then(response => response.json())
	
	    .then(data => {
	
	        alert("Prescription Sent");
	
	        location.reload();
	
	    })
	
	    .catch(error => console.log(error));
	
	}
	</script>
	
	</body>
	</html>

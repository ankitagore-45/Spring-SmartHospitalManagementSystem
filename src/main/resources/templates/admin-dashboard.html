<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | Smart Hospital</title>

    <!-- Bootstrap CSS -->
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{
            background-color:#f4f7fc;
        }

        .navbar{
            background-color:#198754;
        }

        .navbar-brand,
        .nav-link,
        .admin-text{
            color:white !important;
        }

        .card{
            border:none;
            border-radius:15px;
            box-shadow:0 4px 10px rgba(0,0,0,0.1);
			
        }
		.card a{
			text-decoration: none;
			color: black;
			font-weight: bold;
		}

        .dashboard-card{
            transition:0.3s;
        }

        .dashboard-card:hover{
            transform:translateY(-5px);
        }

        .section-title{
            color:#198754;
            font-weight:bold;
        }
		

    </style>

</head>

<body>

<!-- Navbar Start -->

<nav class="navbar navbar-expand-lg navbar-dark px-4">

    <div class="container-fluid">

        <a class="navbar-brand fw-bold" href="admin-dashboard.html">
            <i class="bi bi-hospital"></i>
            Smart Hospital
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <a class="nav-link active" href="/user/admin/dashboard">
                        Dashboard
                    </a>
                </li>

                <li class="nav-item">
					<a class="nav-link"	href="/user/all-patients">
					    Patients
					</a>
                </li>

                <li class="nav-item">
					<a class="nav-link" href="/doctor/all-doctors">
					    Doctors
					</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/appointment/all-appointments">
                        Appointments
                    </a>
                </li>

            </ul>

            <span class="admin-text me-3">
                Welcome Admin
            </span>

            <a href="/login.html" class="btn btn-light btn-sm">
                Logout
            </a>

        </div>

    </div>

</nav>

<!-- Navbar End -->


<!-- Dashboard Section -->

<div class="container mt-5">
	<div class="d-flex justify-content-between align-items-center mb-4">
	
	    <h2 class="section-title m-0">
	        Admin Dashboard
	    </h2>
	
	    <button
	    class="btn btn-success"
	    data-bs-toggle="modal"
	    data-bs-target="#addDoctorModal">
	
	        <i class="bi bi-plus-circle"></i>
	        Add Doctor
	
	    </button>
	
	</div>

    <!-- Cards Row -->

    <div class="Cards-Row row g-4">

        <!-- Total Patients -->

        <div class="col-md-3">

            <div class="card dashboard-card p-4 text-center">

                <i class="bi bi-people-fill text-primary"
                   style="font-size:40px;"></i>

                <a href="all-patients.html" class="mt-3">
                    Total Patients
                </a>

                <h1 class="text-primary" id="totalPatients">
                    0
                </h1>

            </div>

        </div>

        <!-- Total Doctors -->

        <div class="col-md-3">

            <div class="card dashboard-card p-4 text-center">

                <i class="bi bi-person-badge-fill text-success"
                   style="font-size:40px;"></i>

                <a href="all-doctors.html" class="mt-3">
                    Total Doctors
                </a>

                <h1 class="text-success" id="totalDoctors"> 
                  0
                </h1>

            </div>

        </div>

        <!-- Total Appointments -->

        <div class="col-md-3">

            <div class="card dashboard-card p-4 text-center">

                <i class="bi bi-calendar-check-fill text-warning"
                   style="font-size:40px;"></i>

                <h5 class="mt-3">
                    Appointments
                </h5>

                <h1 class="text-warning" id="totalAppointments">
                    0
                </h1>

            </div>

        </div>

        <!-- Pending -->

        <div class="col-md-3">

            <div class="card dashboard-card p-4 text-center">

                <i class="bi bi-hourglass-split text-danger"
                   style="font-size:40px;"></i>

                <h5 class="mt-3">
                    Pending
                </h5>

				<h1 class="text-danger" id="pendingAppointments">
				    0
				</h1>
            </div>

        </div>

    </div>


    <!-- Appointment Table -->

    <div class="card mt-5 p-4">

        <h4 class="section-title mb-4">
            Recent Appointments
        </h4>

        <div class="table-responsive">

            <table class="table table-bordered table-hover align-middle">

                <thead class="table-success">

                    <tr>

                        <th>Patient</th>
                        <th>Doctor</th>
                        <th>Department</th>
                        <th>Date</th>
						<th>Symptoms</th>
                        <th>Status</th>
						<!--   <th>Action</th> -->

                    </tr>

                </thead>

                <tbody id="appointmentTable">

                </tbody>

            </table>

        </div>

    </div>

</div>

<!-- Add Doctor Modal -->

<div class="modal fade"
     id="addDoctorModal"
     tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header bg-success text-white">

                <h5 class="modal-title">
                    Add Doctor
                </h5>

                <button
                type="button"
                class="btn-close btn-close-white"
                data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <form id="doctorForm">

                    <input
                    type="text"
                    class="form-control mb-3"
                    placeholder="Doctor Name"
                    id="doctorName"
                    required>

                    <input
                    type="text"
                    class="form-control mb-3"
                    placeholder="Specialization"
                    id="specialization"
                    required>

                    <input
                    type="text"
                    class="form-control mb-3"
                    placeholder="Experience"
                    id="experience"
                    required>

                    <input
                    type="email"
                    class="form-control mb-3"
                    placeholder="Email"
                    id="email"
                    required>
					

                    <input
                    type="text"
                    class="form-control mb-3"
                    placeholder="Phone"
                    id="phone"
                    required>
					
					<input
					type="password"
					class="form-control mb-3"
					placeholder="Password"
					id="password"
					required>
					
                    <button
                    type="submit"
                    class="btn btn-success w-100">

                        Add Doctor

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

<!-- Bootstrap JS -->

<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- Fetch Appointment Data -->

<script>
		fetch("http://localhost:8181/appointment/all")
	
	.then(response => response.json())
	
	.then(data => {
	
	    let table = document.getElementById("appointmentTable");
	
	    data.forEach(app => {
	
	        let badgeColor = "primary";
	
	        if(app.status === "APPROVED"){
	            badgeColor = "success";
	        }
	
	        else if(app.status === "REJECTED"){
	            badgeColor = "danger";
	        }
	
	        table.innerHTML += `
	
	            <tr>
	
	                <td>${app.fullName}</td>
	
	                <td>${app.doctorName}</td>
	
	                <td>${app.department}</td>
	
	                <td>${app.appointmentDate}</td>
	
	                <td>${app.symptoms}</td>
	
	                <td>
	
	                    <span class="badge bg-${badgeColor}">
	                        ${app.status}
	                    </span>
	
	                </td>
		
	            </tr>
	
	        `;
	
	    });
	
	});
	
	
	// update appointment status
	
	function updateStatus(id, status) {
	
		fetch(`http://localhost:8181/doctor/appointment/status/${id}?status=${status}`, {
	
	        method: "PUT"
	
	    })
	
	    .then(response => response.text())
	
	    .then(data => {
	
	        alert(data);
	
	        location.reload();
	
	    })
	
	    .catch(error => console.log(error));
	
	}
	
	

// modal

document.getElementById("doctorForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    let doctor = {

        doctorName:
            document.getElementById("doctorName").value,

        specialization:
            document.getElementById("specialization").value,

        experience:
            document.getElementById("experience").value,

        email:
            document.getElementById("email").value,

        phone:
            document.getElementById("phone").value,

        password:
            document.getElementById("password").value,

        role: "DOCTOR"
    };

	fetch("http://localhost:8181/doctor/add", {
	
	    method: "POST",
	
	    headers: {
	        "Content-Type": "application/json"
	    },
	
	    body: JSON.stringify(doctor)
	
	})
	
	.then(response => {
	
	    if(response.ok){
	
	        return response.json();
	
	    }
	
	    else{
	
	        throw new Error("Doctor not added");
	
	    }
	
	})
	
	.then(data => {
	
	    alert("Doctor Added Successfully ✅");
	
	    document.getElementById("doctorForm").reset();
	
	    location.reload();
	
	})
	
	.catch(error => {
	
	    console.log(error);
	
	    alert("Error Adding Doctor ❌");
	
	});

});

//dynamic cound of cards
fetch("http://localhost:8181/appointment/admin-counts")

.then(response => response.json())

.then(data => {

    document.getElementById("totalPatients").innerText =
        data.patients;

    document.getElementById("totalDoctors").innerText =
        data.doctors;

    document.getElementById("totalAppointments").innerText =
        data.appointments;

    document.getElementById("pendingAppointments").innerText =
		    data.pending;
});



</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Prescriptions</title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <style>

        body{
            background:#f4f7fc;
        }

        .navbar{
            background:#0d6efd;
        }

        .navbar-brand,
        .nav-link{
            color:white !important;
        }

        .card{
            border:none;
            border-radius:15px;
            box-shadow:0 4px 10px rgba(0,0,0,0.1);
        }

    </style>

</head>

<body>

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark px-4">

    <div class="container-fluid">

        <a class="navbar-brand fw-bold"
           href="#">
            Smart Hospital
        </a>

        <div>

            <a href="/user/patient/dashboard"
               class="btn btn-light btn-sm">
                Back
            </a>

        </div>

    </div>

</nav>


<!-- Main Content -->

<div class="container mt-5">

    <div class="card p-4">

        <h3 class="text-primary mb-4">
            My Prescriptions
        </h3>

        <div class="table-responsive">

            <table class="table table-bordered table-hover">

                <thead class="table-primary">

                    <tr>
						<th>Token</th>
						
                        <th>Date</th>

                        <th>Doctor</th>

                        <th>Medicines</th>

                        <th>Notes</th>
						
						

                    </tr>

                </thead>

                <tbody id="prescriptionTable">

                </tbody>

            </table>

        </div>

    </div>

</div>


<script>

	fetch("/prescription/myPrescription")

.then(response => response.json())

.then(data => {

    let table =
    document.getElementById("prescriptionTable");

    table.innerHTML = "";

    data.forEach(pre => {

        table.innerHTML += `

            <tr>
				<td>${pre.token}</td>
                <td>${pre.date}</td>

                <td>${pre.doctorName}</td>

                <td>${pre.medicines}</td>

                <td>${pre.notes}</td>

            </tr>

        `;

    });

})

.catch(error => console.log(error));

</script>

</body>

</html>
